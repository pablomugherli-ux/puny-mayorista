<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PUNY 2026 INTEGRAL — Sin conexión</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: linear-gradient(135deg, #3D2E05 0%, #9C7A1A 55%, #D4AF37 130%); font-family: system-ui, sans-serif; }
  .card { background:#fff; border-radius:16px; padding:32px; max-width:380px; text-align:center; box-shadow: 0 12px 32px -12px rgba(61,46,5,.45); }
  .logo { width:56px; height:56px; border-radius:16px; background:#7A5C0A; display:flex; align-items:center; justify-content:center;
          margin:0 auto 16px; color:#D4AF37; font-weight:700; font-size:28px; font-family: Georgia, serif; }
  h1 { color:#7A5C0A; font-size:18px; margin:0 0 8px; }
  p { color:#666; font-size:14px; line-height:1.5; margin:0 0 20px; }
  button { background:#7A5C0A; color:#fff; border:none; border-radius:8px; padding:10px 20px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">P</div>
    <h1>Sin conexión a internet</h1>
    <p>Esta pantalla todavía no se descargó para uso sin conexión. Las pantallas que ya visitaste estando online sí van a abrir normalmente. Si estás cargando un pedido, un cobro o una novedad, se guarda en el equipo y se sube sola apenas vuelva la señal.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
